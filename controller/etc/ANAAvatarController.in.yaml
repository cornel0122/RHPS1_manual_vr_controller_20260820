      hrp4:
        target_frame: "R_ELBOW_P_LINK"
        originOffset:
          translation: [0.,0.,0.]
          rotation: [3.14,-1.0472,1.57]
        targetOffset:
          translation: [0,0,0]
          rotation: [3.14,1.0472,0.0]
        activeJoints: [
          R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y,
          R_ELBOW_P,
          R_WRIST_Y, R_WRIST_R, R_WRIST_P] # ,CHEST_Y]
          # We should try enabling CHEST joints too
          # CHEST_P, CHEST_R, CHEST_Y

  ANA::LeftForearmRetargeting:
    base: ANA::RightForearmRetargeting
    body_ros_topic: "avatar/left_forearm/pose"
    body_vel_ros_topic: "avatar/left_forearm/velocity"
    trigger_ros_topic: "avatar/trigger/left_forearm"
    state_ros_topic: "avatar/state/left_forearm"
    mocap_ori_body_num: 12
    robot:
      hrp4cr:
        target_frame: "L_ELBOW_P_LINK"
        originOffset:
          translation: [0.,0.,0.]
          rotation: [3.14,-1.0472,1.57]
        targetOffset:
          translation: [0,0,0]
          rotation: [3.14,-1.0472,3.14]
        activeJoints: [
          L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y,
          L_ELBOW_P,
          L_WRIST_Y, L_WRIST_R, L_WRIST_P] # ,CHEST_Y]
          # We should try enabling CHEST joints too
          # CHEST_P, CHEST_R, CHEST_Y
      hrp4:
        target_frame: "L_ELBOW_P_LINK"
        originOffset:
          translation: [0.,0.,0.]
          rotation: [3.14,-1.0472,1.57]
        targetOffset:
          translation: [0,0,0]
          rotation: [3.14,-1.0472,3.14]
        activeJoints: [
          L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y,
          L_ELBOW_P,
          L_WRIST_Y, L_WRIST_R, L_WRIST_P] # ,CHEST_Y]

  ANA::LeftArmRetargeting:
    base: ANA::RightForearmRetargeting
    body_ros_topic: "avatar/left_arm/pose"
    body_vel_ros_topic: "avatar/left_arm/velocity"
    trigger_ros_topic: "avatar/trigger/left_arm"
    state_ros_topic: "avatar/state/left_arm"
    mocap_ori_body_num: 12
    weight: 10
    robot:
      hrp4cr:
        target_frame: "L_SHOULDER_Y_LINK"
        originOffset:
          translation: [0.,0.,0.]
          rotation: [3.14,-1.0472,1.57]
        targetOffset:
          translation: [0,0,0]
          rotation: [3.14,-1.0472,3.14]
        activeJoints: [
          L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y,
          L_ELBOW_P,
          L_WRIST_Y, L_WRIST_R, L_WRIST_P]
          # We should try enabling CHEST joints too
          # CHEST_P, CHEST_R, CHEST_Y
      hrp4:
        target_frame: "L_SHOULDER_Y_LINK"
        originOffset:
          translation: [0.,0.,0.]
          rotation: [3.14,-1.0472,1.57]
        targetOffset:
          translation: [0,0,0]
          rotation: [3.14,-1.0472,3.14]
        activeJoints: [
          L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y,
          L_ELBOW_P,
          L_WRIST_Y, L_WRIST_R, L_WRIST_P] # ,CHEST_Y]

  ANA::RightArmRetargeting:
    base: ANA::RightForearmRetargeting
    body_ros_topic: "avatar/right_arm/pose"
    body_vel_ros_topic: "avatar/right_arm/velocity"
    trigger_ros_topic: "avatar/trigger/right_arm"
    state_ros_topic: "avatar/state/right_arm"
    mocap_ori_body_num: 12
    weight: 10
    robot:
      hrp4cr:
        target_frame: "R_SHOULDER_Y_LINK"
        originOffset:
          translation: [0.,0.,0.]
          rotation: [3.14,-1.0472,1.57]
        targetOffset:
          translation: [0,0,0]
          rotation: [3.14,1.0472,0.0]
        activeJoints: [
          R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y,
          R_ELBOW_P,
          R_WRIST_Y, R_WRIST_R, R_WRIST_P]
      hrp4:
        target_frame: "R_SHOULDER_Y_LINK"
        originOffset:
          translation: [0.,0.,0.]
          rotation: [3.14,-1.0472,1.57]
        targetOffset:
          translation: [0,0,0]
          rotation: [3.14,1.0472,0.0]
        activeJoints: [
          R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y,
          R_ELBOW_P,
          R_WRIST_Y, R_WRIST_R, R_WRIST_P] # ,CHEST_Y]

  ANA::HeadRetargeting:
    base: ANA::RightForearmRetargeting
    body_ros_topic: "avatar/head/pose"
    body_vel_ros_topic: "avatar/head/velocity"
    trigger_ros_topic: "avatar/trigger/head_"
    state_ros_topic: "avatar/state/head_"
    mocap_ori_body_num: 15
    # minStiffness: 50
    maxStiffness: 50
    ignore_emergency: true
    always_actve: true
    robot:
      hrp4cr:
        target_frame: "NECK_P_LINK"
        body_frame_relative_pose:
          translation: [0.1,0,0.1]
          rotation: [0,0.30,0]
        originOffset:
          translation: [0.,0.,0.]
          rotation: [3.14,-1.0472,1.57]
        targetOffset:
          translation: [0,0,0]
          rotation: [0.,0.,1.57]
        activeJoints: [NECK_P, NECK_Y, NECK_R] # ,CHEST_Y]
          # We should try enabling CHEST joints too
          # CHEST_P, CHEST_R, CHEST_Y
      hrp4:
        target_frame: "NECK_P_LINK"
        originOffset:
          translation: [0.,0.,0.]
          rotation: [3.14,-1.0472,1.57]
        targetOffset:
          translation: [0,0,0]
          rotation: [0.,0.,1.57]
        activeJoints: [NECK_P, NECK_Y] # ,CHEST_Y]
          # We should try enabling CHEST joints too
          # CHEST_P, CHEST_R, CHEST_Y

  ANA::LeftRetargeting:
    base: RetargetingControl
    retargeting_states: [ANA::LeftForearmRetargeting,ANA::LeftArmRetargeting,ANA::LeftHandRetargeting]
    trigger_ros_topic: "avatar/trigger/left"
    state_ros_topic: "avatar/state/left"

  ANA::RightRetargeting:
    base: RetargetingControl
    retargeting_states: [ANA::RightForearmRetargeting,ANA::RightArmRetargeting,ANA::RightHandRetargeting]
    trigger_ros_topic: "avatar/trigger/right"
    state_ros_topic: "avatar/state/right"

  ANA::Head:
    base: RetargetingControl
    retargeting_states: [ANA::HeadRetargeting]
    trigger_ros_topic: "avatar/trigger/head"
    state_ros_topic: "avatar/state/head"

  ANA::LeftGripper:
    base: GripperHandling
    datastoreJoy: LeftHandJoy
    datastoreGripper: LeftGripper
    force_feedback_topic: avatar/left_gripper/force_feedback
    vibration_feedback_topic: avatar/left_gripper/vibration_feedback
    gripper_opening_topic: avatar/left_gripper/opening
    force_feedback_offset: 0.8
    robot:
      hrp4j:
        gripper: "l_gripper"
        thumbJoint: "L_HAND_J0"
        fingersJoint: "L_HAND_J1"
      hrp4cr:
        gripper: "l_gripper"
        thumbJoint: "L_HAND_THUMB_J0"
        fingersJoint: "L_HAND_THUMB_J0"
      hrp4:
        gripper: "l_gripper"
        thumbJoint: "L_HAND_J0"
        fingersJoint: "L_HAND_J0"
    thumbPercentOpen: 0.7
    thumbPercentClosed: 0.05
    fingersPercentOpen: 0.7
    fingersPercentClosed: 0.05
    safety:
      threshold: 8
      iter: 8
      release: 0
      vmaxPercent: 0.25

  ANA::RightGripper:
    base: ANA::LeftGripper
    force_feedback_topic: avatar/right_gripper/force_feedback
    vibration_feedback_topic: avatar/right_gripper/vibration_feedback
    gripper_opening_topic: avatar/right_gripper/opening
    datastoreJoy: RightHandJoy
    datastoreGripper: RightGripper
    robot:
      hrp4j:
        gripper: "r_gripper"
        thumbJoint: "R_HAND_J0"
        fingersJoint: "R_HAND_J1"
      hrp4cr:
        gripper: "r_gripper"
        thumbJoint: "R_HAND_THUMB_J0"
        fingersJoint: "R_HAND_THUMB_J0"
      hrp4:
        gripper: "r_gripper"
        thumbJoint: "R_HAND_J0"
        fingersJoint: "R_HAND_J0"

  ANA::PutLeftHandAboveTable:
    base: MetaTasks
    tasks:
      HandTrajectory:
        name: LeftHandTrajectory
        type: bspline_trajectory
        frame: LeftHand
        stiffness: 500.0
        duration: 5.0
        weight: 100
        dimWeight: [0.5, 0.5, 0.5, 1.0, 1.0, 1.0]
        completion:
          timeElapsed: true
        target:
          translation: [0.2, 0.4, 1.]
          rotation: [0, -1.57, 0]
        controlPoints:
        [
          [-0.2, 0.6, 1.2]
        ]

  ANA::PutRightHandAboveTable:
    base: ANA::PutLeftHandAboveTable
    tasks:
      HandTrajectory:
        name: RightHandTrajectory
        frame: RightHand
        target:
          translation: [0.2, -0.4, 1.]
          rotation: [0, -1.57, 0]
        controlPoints:
        [
          [-0.2, -0.6, 1.2]
        ]

  ANA::PutHandsAboveTable:
    base: Parallel
    states: [ANA::PutLeftHandAboveTable, ANA::PutRightHandAboveTable]

  # RHPS1 专用无碰撞准备轨迹。第一段只约束位置，让双手在身体近侧
  # 竖直抬到桌面上方；不在低位改变手部方向或向桌面前方横扫。
  ANA::PrepareRHPS1LiftLeftHand:
    base: MetaTasks
    tasks:
      HandTrajectory:
        name: PrepareRHPS1LiftLeftHandTrajectory
        type: bspline_trajectory
        frame: LeftHandSupportPlate
        stiffness: 30.0
        duration: 5.0
        weight: 100
        dimWeight: [0.0, 0.0, 0.0, 1.0, 1.0, 1.0]
        activeJoints: [
          L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y,
          L_ELBOW_P, L_ELBOW_Y,
          L_WRIST_R, L_WRIST_Y]
        completion:
          timeElapsed: true
        target:
          translation: [-0.02, 0.27, 1.07]
          rotation: [0.0, 0.0, 0.0]
        controlPoints:
          - [-0.02, 0.27, 0.93]

  ANA::PrepareRHPS1LiftRightHand:
    base: ANA::PrepareRHPS1LiftLeftHand
    tasks:
      HandTrajectory:
        name: PrepareRHPS1LiftRightHandTrajectory
        frame: RightHandSupportPlate
        activeJoints: [
          R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y,
          R_ELBOW_P, R_ELBOW_Y,
          R_WRIST_R, R_WRIST_Y]
        target:
          translation: [-0.02, -0.27, 1.07]
          rotation: [0.0, 0.0, 0.0]
        controlPoints:
          - [-0.02, -0.27, 0.93]

  ANA::PrepareRHPS1LiftHands:
    base: Parallel
    states: [ANA::PrepareRHPS1LiftLeftHand, ANA::PrepareRHPS1LiftRightHand]

  # 第二段保持安全高度，只向前和略微向外移动。
  ANA::PrepareRHPS1ReachLeftHand:
    base: ANA::PrepareRHPS1LiftLeftHand
    tasks:
      HandTrajectory:
        name: PrepareRHPS1ReachLeftHandTrajectory
        duration: 4.0
        target:
          translation: [0.20, 0.36, 1.07]
          rotation: [0.0, 0.0, 0.0]
        controlPoints:
          - [0.08, 0.31, 1.07]

  ANA::PrepareRHPS1ReachRightHand:
    base: ANA::PrepareRHPS1LiftRightHand
    tasks:
      HandTrajectory:
        name: PrepareRHPS1ReachRightHandTrajectory
        duration: 4.0
        target:
          translation: [0.20, -0.36, 1.07]
          rotation: [0.0, 0.0, 0.0]
        controlPoints:
          - [0.08, -0.31, 1.07]

  ANA::PrepareRHPS1ReachHands:
    base: Parallel
    states: [ANA::PrepareRHPS1ReachLeftHand, ANA::PrepareRHPS1ReachRightHand]

  # 第三段只下降少量，进入 Vive 接管前的工作高度。
  ANA::PrepareRHPS1SettleLeftHand:
    base: ANA::PrepareRHPS1ReachLeftHand
    tasks:
      HandTrajectory:
        name: PrepareRHPS1SettleLeftHandTrajectory
        duration: 2.5
        target:
          translation: [0.20, 0.36, 1.03]
          rotation: [0.0, 0.0, 0.0]

  ANA::PrepareRHPS1SettleRightHand:
    base: ANA::PrepareRHPS1ReachRightHand
    tasks:
      HandTrajectory:
        name: PrepareRHPS1SettleRightHandTrajectory
        duration: 2.5
        target:
          translation: [0.20, -0.36, 1.03]
          rotation: [0.0, 0.0, 0.0]

  ANA::PrepareRHPS1SettleHands:
    base: Parallel
    states: [ANA::PrepareRHPS1SettleLeftHand, ANA::PrepareRHPS1SettleRightHand]

  ANA::PrepareRHPS1ForVR:
    base: Meta
    transitions:
      - [ANA::PrepareRHPS1LiftHands, OK, ANA::PrepareRHPS1ReachHands, Auto]
      - [ANA::PrepareRHPS1ReachHands, OK, ANA::PrepareRHPS1SettleHands, Auto]

  ANA::ROSPublisherState:
    base: ROSPublisherState
    UnityInitPoseTopic: "/mc_rtc_init_pose_unity"
    emergency_state_topic: "avatar/state/emergency"
    cameraFrame: ZMiniCenter

  ANA::JoystickControl:
    base: JoystickControl
    modality: UnityHeadJoystick
    max_vel_forward: 0.13
    max_vel_backward: -0.1
    max_vel_side: 0.05
    max_vel_rot: 0.3
    head_retargeting_state_name: "ANA::HeadRetargeting"
    retargeting_state_names: ["ANA::LeftHandRetargeting", "ANA::LeftArmRetargeting", "ANA::RightHandRetargeting", "ANA::RightArmRetargeting"]
    Unity:
      Joystick:
        timeout: 0.5
        deadzone: [0.1, 0.4, 0.1]
      HeadJoystick:
        datastore_reference: RobotRetargetingReference
        max_rot_yaw: 55
        min_rot_yaw: 10
        max_vel_pitch: -40
        min_vel_pitch: 10
        orientation_offset:
          translation: [0,0,0]
          rotation: [0,0,3.14]
    Joystick:
      left_retargeting_state_name: "ANA::LeftRetargeting"
      right_retargeting_state_name: "ANA::RightRetargeting"
    ROS:
      walking_dir_ros_topic: "avatar/state/walk_dir"
      forward_trigger_ros_topic: "avatar/trigger/forward"
      stride_trigger_ros_topic: "avatar/trigger/side"
      Joy:
        topic: /joy
        # Axis configuration for XBox controller
        forward_axis: 1
        side_axis: 0
        rot_axis: 3
        timeout: 0.5
        deadzone: [0.1, 0.1, 0.1]

  ANA::UpdatePosture:
    base: UpdatePosture

  ANA::MeasureObjectWeightLeft:
    base: MeasureObjectWeight
    Frame: LeftHand
    Contact_Frame: RightHand
    ForceSensorName: LeftHandForceSensor
    contact_ditance: 0.1
    pub_topic: avatar/state/left_weight
    finger_force_topic: avatar/state/left_hand/force_fingers/index

  ANA::MeasureObjectWeightRight:
    base: ANA::MeasureObjectWeightLeft
    ForceSensorName: RightHandForceSensor
    pub_topic: avatar/state/right_weight
    Contact_Frame: LeftHand
    Frame: RightHand
    finger_force_topic: avatar/state/right_hand/force_fingers/index

  ANA::FacialExpression:
    base: FacialExpression
    sub_topic: avatar/face_data
    activeJoints: [EYE_Y, EYE_P, EYELID_P, MOUTH_P]
    stiffnesses: [100, 100, 100, 100]

  ANA::RetargetingReference:
    base: RetargetingReference
    camera_pose_topic: avatar/zed_relative_pose
    UseRos: false
    reference_frame_topic: "avatar/retargeting_reference"
    robot:
      hrp4cr:
        torsoFrame: "BODY"
        camera_frame: "ZMiniCenter"
        originOffset:
          translation: [-0.15, 0 , 0.15]
          rotation: [0,0,3.14]
      hrp4:
        camera_frame: "ZMiniCenter"
        torsoFrame: "torso"
        originOffset:
          translation: [-0.15,0,-0.05]
          rotation: [0,0,3.14]

  ANA::SynchroWalking:
    base: SynchroWalk
    trigger_ros_topic: "avatar/trigger/walk"
    state_ros_topic: "avatar/state/walking"
    datastoreRetargetingReference: RobotRetargetingReference
    next_ts_topic: "avatar/NextTs"
    next_tds_topic: "avatar/NextTds"
    stop_topic: "avatar/Stop"
    support_foot_topic: "avatar/SupportFoot"
    single_support_topic: "avatar/FeetUp"
    step_id_topic: "avatar/StepID"
    ratio_topic: "avatar/Ratio"
    trigger_mode: true
    use_vive_trakcer: true
    activation_threshold: 0.5

  # Handles pausing/resuming walking when suitable
  # ex: emergency, no joystick inputs, CoM retargetting active, etc.
  ANA::TriggerWalking:
    base: TriggerWalking
    datastoreJoy: LeftHandJoy


  # Retargetting related states:
  # The current method relies on retargetting w.r.t a marker placed on the operator's chest
  # A similar reference is chosen on the robot's own chest (see RetargetingReference state)
  # - For the head only orientation is retargetted
  # - For the hands both orientation and position is retargetted. Note that appropriate scaling must be selected depending on the operator
  # - Elbow orientation is also retargetted to avoid unnatural postures or redundant DoFs
  # - CoM retargetting is a toggle behaviour that moves the CoM up/down and bends the chest according to CoM height. This coupled motion
  #   was chosen to reduce the strain on the knees of HRP4CR
  #

  Avatar::Retargetting::Left:
    base: Parallel
    states:
    - ANA::LeftHandRetargeting
    - ANA::LeftArmRetargeting
    - ANA::LeftRetargeting
    - ANA::LeftGripper
    - ANA::MeasureObjectWeightLeft

  Avatar::Retargetting::Right:
    base: Parallel
    states:
    - ANA::RightHandRetargeting
    - ANA::RightArmRetargeting
    - ANA::RightRetargeting
    - ANA::RightGripper
    - ANA::MeasureObjectWeightRight

  Avatar::Retargetting::Head:
    base: Parallel
    states:
    - ANA::HeadRetargeting
    - ANA::Head
    # ROS2 Vive 头显桥在头部任务创建后写入目标姿态。
    - ANA::ViveHeadBridge

  Avatar::Retargetting:
    base: Parallel
    states:
    - ANA::ROSInputState
    # Main retargetting states
    - ANA::JoystickControl
    - ANA::RetargetingReference
    - Avatar::Retargetting::Head
    - Avatar::Retargetting::Left
    - Avatar::Retargetting::Right
    - ANA::CoMRetargeting
    # ROS2 Vive 手柄/追踪器桥在四个 retargetting task 创建后写入目标。
    - ANA::ViveHandBridge
    - ANA::IntentRecognitionBridge
    - ANA::UI_SharedAutonomy
    - ANA::SharedAutonomyLeftHand
    - ANA::SharedAutonomyRightHand

  Avatar::Retargetting::HeadPlusLeft:
    base: Parallel
    states:
    # Main retargetting states
    - ANA::RetargetingReference
    - Avatar::Retargetting::Head
    - Avatar::Retargetting::Left
    - Avatar::Retargetting::Right
    - ANA::ViveHandBridge
    - ANA::IntentRecognitionBridge
    - ANA::UI_SharedAutonomy
    - ANA::SharedAutonomyLeftHand
    - ANA::SharedAutonomyRightHand

  # 实体 RHPS1 纯手动版本只创建手、臂、头部任务和 Vive 输入桥。
  # 不加载物体意图、共享自主、MuJoCo 磁吸或旧 Unity 话题。
  Avatar::Retargetting::ManualLeft:
    base: Parallel
    states:
    - ANA::LeftHandRetargeting
    - ANA::LeftArmRetargeting
    - ANA::LeftRetargeting

  Avatar::Retargetting::ManualRight:
    base: Parallel
    states:
    - ANA::RightHandRetargeting
    - ANA::RightArmRetargeting
    - ANA::RightRetargeting

  ANA::ViveHandBridgeManual:
    base: ANA::ViveHandBridge
    input_delay: 0.0
    publish_legacy_unity_topics: false
    control_mujoco_adhesion: false
    robot:
      rhps1:
        control_mujoco_adhesion: false

  Avatar::Retargetting::Manual:
    base: Parallel
    states:
    - ANA::ROSInputState
    - ANA::RetargetingReference
    - Avatar::Retargetting::Head
    - Avatar::Retargetting::ManualLeft
    - Avatar::Retargetting::ManualRight
    # 该状态启动时先把四个 task 固定在机器人当前姿态；双手 menu 确认后才平滑接管。
    - ANA::ViveHandBridgeManual

  ANA::WalkInternal:
    base: Meta
    transitions:
    - [LIPMWalking::Standing, DoubleSupport, LIPMWalking::DoubleSupport]
    - [LIPMWalking::DoubleSupport, SingleSupport, LIPMWalking::SingleSupport]
    - [LIPMWalking::DoubleSupport, Standing, LIPMWalking::Standing]
    - [LIPMWalking::SingleSupport, DoubleSupport, LIPMWalking::DoubleSupport]
    configs:
      LIPMWalking::Standing:
        autoplay: false
        autoplay_plans: [external]

  ANA::WalkFSM:
    base: Parallel
    states: [LIPMWalking::RunStabilizer, ANA::WalkInternal]

  ANA::DemoFSM:
    base: Meta
    transitions:
      # XXX consider adding a "CheckEmergency" state that blocks until the emergency state is released
@AVATAR_DEMO_FSM_TRANSITIONS@
    configs:
      Pause:
        duration: 2

  # 真机纯手动入口不经过 PrepareRHPS1ForVR，避免使用按 MuJoCo 桌面调出的绝对坐标。
  ANA::ManualDemoFSM:
    base: Meta
    transitions:
      - [Pause, OK, Avatar::Retargetting::Manual, Auto]
    configs:
      Pause:
        duration: 2

  ANA::ManualDemo:
    base: Parallel
    states:
      # 保持控制模型姿态参考与编码器同步，并保留 RHPS1 双足站立稳定器。
      - ANA::UpdatePosture
      - ANA::ManualDemoFSM
      - ANA::WalkFSM
  # Full FSM for the demo
  ANA::Demo:
    base: Parallel
    states:

      - ANA::UpdatePosture      # Continuously update the robot's reference posture to the current tracked posture
                                #This is done both to track the operator's motion more accurately, and as a safety
                                #measure in case tasks are unexcpectedly removed.
      - ANA::SynchroWalking

      - ANA::FacialExpression

      - ANA::DemoFSM           # Main demo logic implemented as a sub-FSM

      @AVATAR_DEMO_WALK_FSM_STATE@

transitions:
  - [@AVATAR_INITIAL_STATE@, @AVATAR_INITIAL_STATE_OUTPUT@, @AVATAR_DEMO_STATE@]

simulation: @SIM_CONF@
use_emergency_button: false

Plugins: @AVATAR_PLUGINS@

ObserverPipelines:
  name: "LIPMWalkingObserverPipeline"
  gui: false
  observers:
    - type: Encoder
    - type: Attitude
      required: true
    - type: KinematicInertial
      config:
        anchorFrame:
          maxAnchorFrameDiscontinuity: 0.02
    - type: BodySensor
      update: false

mpc:
  weights:
    jerk: 1.0
    vel: [10.0, 100.0]
    zmp: 1000.0

ExternalWrenches:
  surfaces: ["LeftHand", "RightHand"]

plans:
  hrp4cr:
    ashibumi: # stepping in place
      double_support_duration: 0.5
      single_support_duration: 0.8
      com_height: 0.817301
      swing_height: 0.04
      contacts:
        - pose:
            translation: [0.035, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.035, 0.07, 0.0]
          surface: LeftFootCenter
        - pose:
            translation: [0.035, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.035, 0.07, 0.0]
          surface: LeftFootCenter
        - pose:
            translation: [0.035, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.035, 0.07, 0.0]
          surface: LeftFootCenter
        - pose:
            translation: [0.035, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.035, 0.07, 0.0]
          surface: LeftFootCenter
        - pose:
            translation: [0.035, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.035, 0.07, 0.0]
          surface: LeftFootCenter
        - pose:
            translation: [0.035, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.035, 0.07, 0.0]
          surface: LeftFootCenter
    custom_backward:
      double_support_duration: 0.5
      single_support_duration: 0.8
      step_length: 0.1
      swing_height: 0.05
      com_height: 0.817301
      contacts:
        - pose:
            translation: [0.0, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.0, 0.07, 0.0]
          surface: LeftFootCenter
    custom_forward:
      double_support_duration: 0.4
      single_support_duration: 0.7
      step_length: 0.15
      swing_height: 0.04
      com_height: 0.817301
      contacts:
        - pose:
            translation: [0.0, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.0, 0.07, 0.0]
          surface: LeftFootCenter
    custom_lateral:
      double_support_duration: 0.4
      single_support_duration: 0.7
      step_length: 0.1
      swing_height: 0.04
      com_height: 0.817301
      contacts:
        - pose:
            translation: [0.0, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.0, 0.07, 0.0]
          surface: LeftFootCenter
      mpc:
        weights:
          jerk: 1.0
          vel: [10.0, 300.0]
          zmp: 1000.0
    warmup:
      double_support_duration: 0.5
      single_support_duration: 0.7
      swing_height: 0.04
      com_height: 0.817301
      contacts:
        - pose:
            translation: [0.035, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.035, 0.07, 0.0]
          surface: LeftFootCenter
        - pose:
            translation: [0.035, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.035, 0.07, 0.0]
          surface: LeftFootCenter
    external:
      double_support_duration: 0.5
      single_support_duration: 0.7
      ####
      # Configures the maximum allowed time for the planner to compute a solution.
      # If the planner could not compute a plan in the allowed time, the robot will pause walking until a new request
      # is sent and successful.
      # If the robot pauses walking too often, try increasing this parameter.
      ####
      allowed_planning_time:
        # the maximum allowed time during standing may be arbitrarely large (we don't need to react fast)
        # This corresponds to the absolute maximum time that the user will have to wait for a plan (or notification of failure)
        standing: 2.0
        # the maximum allowed time during single support should be as short as possible but still ensure that in normal operations
        # the planner has enough time to come up with a solution.
        # This parameter MUST BE less than single_support_duration, and allow a sufficient margin to account for communication delay with the planner
        # - reducing it increases reactivity (we have a longer window of opportunity during which the single support phase can request a plan)
        # - increasing it decrases reactivity but increases the likelyhood that the planner will successfully find a solution
        single_support: 0.2
      swing_height: 0.04
      com_height: 0.817301
      contacts:
        - pose:
            translation: [0.035, -0.07, 0.0]
          surface: RightFootCenter
        - pose:
            translation: [0.035, 0.07, 0.0]
          surface: LeftFootCenter
      mpc:
        weights:
          jerk: 1.0
          vel: [10.0, 100.0]
          zmp: 1000.0
      # Offset (x,y,theta) between the plan's target frame and the left/right foot expressed in target frame
      leftFootLandingOffset: [0.0, 0.07, 0.0] # x, y, theta
      rightFootLandingOffset: [0.0, -0.07, 0.0] # x, y, theta


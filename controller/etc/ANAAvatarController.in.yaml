---
# If true, the FSM transitions are managed by an external tool
Managed: false
# If true and the FSM is self-managed, transitions should be triggered
StepByStep: false
# Change idle behaviour, if true the state is kept until transition,
# otherwise the FSM holds the last state until transition
IdleKeepState: true
# Where to look for state libraries
StatesLibraries:
- "@MC_STATES_DEFAULT_INSTALL_PREFIX@"
- "@MC_STATES_INSTALL_PREFIX@"
- "@LIPM_WALKING_STATES_LIBRARIES@"

# Where to look for state files
StatesFiles:
- "@MC_STATES_DEFAULT_INSTALL_PREFIX@/data"
- "@MC_STATES_INSTALL_PREFIX@/data"
- "@LIPM_WALKING_STATES_FILES@"

# If true, state factory will be more verbose
VerboseStateFactory: false
# Additional robots to load
joint_safety:
  hrp4cr:
    joints: ["L_WRIST_P", "L_WRIST_Y", "L_WRIST_R","R_WRIST_P", "R_WRIST_Y", "R_WRIST_R"]
  error_threshold: 0.05

robots:
  hrp4cr:
    frames:
      - name: ZMiniCenter
        parent: NECK_P_LINK
        X_p_f:
          translation: [0.11, 0, 0.078]
          rotation: [0, 0.436, 0]

  ground:
    module: env/ground
# General constraints, always on
constraints:
- type: contact
- type: kinematics
#- type: dynamics
  damper: [0.1, 0.01, 0.5]
# - type: compoundJoint

# Collision constraint
# collisions:
# - type: collision
#   useCommon: true

collisions:
  hrp4cr:
    iDist: 0.01
    sDist: 0.005
    simplified_all_bodies: [BODY, NECK_P_LINK, CHEST_Y_LINK,
                           L_SHOULDER_P_LINK, L_SHOULDER_R_LINK, L_SHOULDER_Y_LINK,
                           L_ELBOW_P_LINK, L_WRIST_Y_LINK, L_WRIST_R_LINK, L_WRIST_P_LINK,
                           R_SHOULDER_P_LINK, R_SHOULDER_R_LINK, R_SHOULDER_Y_LINK, R_ELBOW_P_LINK,
                           R_WRIST_Y_LINK, R_WRIST_R_LINK, R_WRIST_P_LINK,
                           L_HIP_P_LINK ,
                           R_HIP_P_LINK ,
                           R_KNEE_P_LINK, L_KNEE_P_LINK]
    cstr_set_0:
      b1: [L_SHOULDER_Y_LINK, L_ELBOW_P_LINK, L_HAND_PALM]
      b2: [R_HIP_P_LINK , L_HIP_Y_LINK , BODY, NECK_P_LINK, CHEST_Y_LINK]
      joints: [L_SHOULDER_P, L_SHOULDER_R, L_SHOULDER_Y, L_ELBOW_P, L_WRIST_Y, L_WRIST_R, L_WRIST_P]
    cstr_set_1:
      b1: [R_SHOULDER_Y_LINK, R_ELBOW_P_LINK, R_HAND_PALM]
      b2: [R_HIP_P_LINK , L_HIP_Y_LINK , BODY, NECK_P_LINK, CHEST_Y_LINK]
      joints: [R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y, R_ELBOW_P, R_WRIST_Y, R_WRIST_R, R_WRIST_P]
    cstr_set_2:
      b1: [R_ELBOW_P_LINK, R_HAND_PALM]
      b2: [L_ELBOW_P_LINK, L_HAND_PALM]
      joints: [R_SHOULDER_P, R_SHOULDER_R, R_SHOULDER_Y, R_ELBOW_P, R_WRIST_Y, R_WRIST_R, R_WRIST_P]
    # cstr_set_3:
    #   b1: [ L_ANKLE_R_LINK, L_TOE_P_LINK]
    #   b2: [ R_ANKLE_R_LINK, R_TOE_P_LINK]
    #   joints: []
    cstr_set_3:
      b1: [ L_HIP_P_LINK]
      b2: [ R_HIP_P_LINK]
      joints: []

ismpc:
  Tc: 1.5
  Tp: 10
  delta: 0.05
  beta_zmp_vel: 0.001
  beta_dcm: 0
  beta_dcm_static: 0
  beta_step: 1e3
  beta_stab: 1e5
  beta_traj: 1e1
  allow_none_tail: true
  foosteps_kin_cstr: [0.6,0.25]
  footsteps_cstr_square: [0.6,0.25]
  ts_range: [0.7,2]
  tds_range: [0.2,1.5]
  tss_range: [0.5,1.5]
  double_support_ratio: 0.4
  ts: 1.3
  sliding_zmp_cstr_region: false
  use_stability_task: false
  safety_thresholds:
    beta_range: [1e-9,1e9]
    zmp_cstr_square_min: 0.01
    zmp_cstr_square_max: 1
  # hrp4
  zmp_cstr_square: [0.14,0.08]
  zmp_cstr_square_sg_supp: [0.14,0.05]
  zmp_cstr_square_static: [0.14,0.08]
  zmp_ref_offset: [0.0,0.05]
  offset: [-0.00,0.0]
  offset_sg: [0.,0.0]
  next_stp_cstr_ratio: 1
  next_stp_cstr_ratio: 0.1

footsteps_planner: &footsteps_planner
  Tp: 10
  delta: 0.1
  Ts_limit: [0.4,5]
  kinematics_cstr: [0.6,0.08]
  mean_speed: 0.1
  robot_height: 150
  max_rotation: 0.1

HybridPlanner: *footsteps_planner

mocap_plugin:
  ip: "192.168.2.13"
  activate_on_start: false
  port: 7001
  frequency: 60
  sequence_size: 60

tasks:
  posture:
    stiffness: 1.0
    weight: 10.0
  swingfoot_stiffness: 50
  swingfoot_weight: 5000
  swingfoot_dimweight: [1.,1.,1.,1.,1.,1.]
  swingfoot_dimstiffness: [1.,1.,1.,1.,1.,1.]
  momentum_task_weight: 100000

walking_controller:
  auto_start:
    activate: false
    steps: 10
    speed: [0,0.0,0]
    t_steps: 1.1
  min_sg_suport_duration: 0.75
  min_dbl_suport_duration: 0.25
  foot_landing_offset: -3e-3
  max_step_duration: 2
  impact_threshold: 40
  footstep_height: 0.03
  wrench_filter_cutoff_T: 2
  gamma_filter_cutoff_T: 2
  safety_foot_roll_error: 0.1
  max_swing_foot_velocity: 1.6
  stability_error_threshold: 0.2
  robot:
    hrp4:
      torsoBodyName: "torso"
      leftFootLink: "l_ankle"
      rightFootLink: "r_ankle"
      left_hand_surface: "LeftHand"
      right_hand_surface: "RightHand"
      right_foot_surface: "RightFootCenter"
      left_foot_surface: "LeftFootCenter"
    hrp4cr:
      torsoBodyName: "CHEST_P_LINK"
      leftFootLink: "L_TOE_P_LINK"
      rightFootLink: "R_TOE_P_LINK"
      left_hand_surface: "LeftHand"
      right_hand_surface: "RightHand"
      right_foot_surface: "RightFootCenter"
      left_foot_surface: "LeftFootCenter"


stabilizer:
  robot: &stabilizer-robot
    hrp4cr:
      sole:
        half_length: 0.08
        half_width: 0.038
        friction: 0.7
        leftAnkleOffset: [0.0, -0.02] # target center of foot
      torso:
        pitch: 0.0
      stabilizer:
        dcm_tracking:
          integrator_time_constant: 0.04
          gains:
            prop: [6,6]
            integral: [4,6]
            deriv: [0.3, 0.3]
            comdError: 0.
        admittance:
          df: [0, 0, 0.0002]
          cop: [0.03, 0.03]
          maxVel:
            angular: [3., 3., 3.]
            linear: [1., 1., 1.]
        tasks:
          contact:
            damping: 300.
          torso:
            stiffness: 2
            weight: 100
          pelvis:
            stiffness: 2
            weight: 500
          com:
            stiffness: [1000.,1000.,100.]
            dimWeight: [1 , 1 , 1]
            weight: 1000.
            height: 0.82
        dcm_bias:
          dcmMeasureErrorStd: 0.001
          biasDriftPerSecondStd: 0.0001
          zmpMeasureErrorStd: 0.0005
          comBiasLimit: [0.1,0.1]
          biasLimit: [0.05, 0.02]
          withDCMBias: true
          correctCoMPos: true
        external_wrench:
          ## general ##
          add_expected_com_offset: false
          subtract_measured_value: true
          exclude_from_dcm_bias_est: true
          ## com offset ##
          modify_com_error: true
          modify_zmp_error: true
          modify_zmp_error_d: false
          com_offset_err_com_limit: 0.05
          com_offset_err_zmp_limit: 0.05
          ## filter ##
          ext_wrench_sum_cutoff: 0.05
          com_offset_cutoff: 0.05
          com_offset_com_cutoff: 10.0
          derivator_time_constant: 1.0
          ## gain (not loaded automatically) ##
          ext_wrench_gain: [1, 1, 1]
      stabilizer_sgsupp:
        dcm_tracking:
          gains:
            prop: [3,3]
            integral: [9,9]
            deriv: [0.3,0.3]
            comdError: 0.
        admittance:
          dfz: 0.0002
          cop: [0.03, 0.03]
        tasks:
          torso:
            weight: 500
          pelvis:
            weight: 500
        admittance:
          dfz: 0.0001
          cop: [0.03, 0.03]
      stabilizer_dblsupp:
        dcm_tracking:
          gains:
            prop: [5,5]
            integral: [5,5]
            deriv: [0.3,0.3]
            comdError: 0.
        tasks:
          torso:
            weight: 500
          pelvis:
            weight: 500
        admittance:
          dfz: 0.0002
          cop: [0.03, 0.03]
    hrp4:
       stabilizer:
        dcm_tracking:
          gains:
            prop: [3,3]
            integral: [10,10]
            deriv: [0.,0.]
            comdError: 1.
        admittance:
          cop: [0.01, 0.017]
          maxVel:
            angular: [.5, .5, .5]
            linear: [1., 1., 1.]
        tasks:
          torso:
            pitch: 0.12
            stiffness: 2
            weight: 500
          com:
            stiffness: [1000.,1000.,100.]
            weight: 1000.
            dimWeight: [1 , 1 , 1]
            height: 0.78
    #     dcm_bias:
    #       dcmMeasureErrorStd: 0.001
    #       biasDriftPerSecondStd: 0.0001
    #       zmpMeasureErrorStd: 0.0005
    #       biasLimit: [0.05, 0.02]
    #       withDCMBias: true

robot_models: *stabilizer-robot

#Use ROS topics to get the data, otherwise it will use the mc_rtc gui poses

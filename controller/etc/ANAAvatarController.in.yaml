    dimWeight: [1, 1, 1, 0, 0, 0]
    dimStiffness: [1, 1, 1, 1, 1, 1]
    updatePosture: true
    robot:
      hrp4cr:
        target_frame: "R_ELBOW_P_LINK"
        originOffset:
          translation: [0.,0.,0.]
          rotation: [3.14,-1.0472,1.57]
        targetOffset:
          translation: [0,0,0]
          rotation: [3.14,1.0472,0.0]
        activeJoints: [
